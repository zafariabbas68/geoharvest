# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
app.name=GeoHarvest Platform
app.version=2.0.0
app.description=Universal Geospatial Metadata Harvester with STAC & INSPIRE

# GeoServer Configuration (optional)
geoserver.url=http://localhost:8082/geoserver
geoserver.username=admin
geoserver.password=admin

# Logging
logging.level.com.geoharvest=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
